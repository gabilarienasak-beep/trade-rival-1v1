<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeRival 1v1 - Real-Time Crypto Trading Duel Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background-color: #090d16; color: #f8fafc; font-family: monospace; }
        canvas { border: 2px solid #334155; border-radius: 8px; background: #020617; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <header class="text-center mb-3">
        <h1 class="text-3xl font-extrabold text-amber-400 tracking-wider">⚡ TRADERIVAL 1v1 ⚡</h1>
        <p class="text-xs text-slate-400">Live 1-Min Candlestick Chart & Cumulative PnL Combat</p>
    </header>

    <div class="relative w-full max-w-2xl">
        <!-- HUD Header -->
        <div class="flex justify-between items-center bg-slate-800/90 backdrop-blur p-3 rounded-t-lg border-b border-slate-700">
            <div>
                <span class="text-xs text-slate-400">BTC/USDT LIVE:</span>
                <span id="livePrice" class="text-lg font-bold text-green-400">$0.00</span>
            </div>
            <div class="text-right">
                <span class="text-xs text-slate-400">TOTAL NET PnL:</span>
                <span id="totalNetPnL" class="text-lg font-bold text-amber-400">$0.00</span>
                <div class="text-xs text-slate-400">
                    Banked: <span id="bankedScoreDisp">$0.00</span> | Active: <span id="floatingPnL">$0.00</span>
                </div>
            </div>
        </div>

        <!-- Hybrid Canvas Stage (Chart + Fighting Arena) -->
        <canvas id="gameCanvas" width="600" height="320" class="w-full"></canvas>

        <!-- Trading Controls -->
        <div class="grid grid-cols-3 gap-2 mt-3">
            <button onclick="handleTrade('LONG')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-lg shadow-lg transition">
                🐂 LONG (BUY)
            </button>
            <button onclick="handleClose()" class="bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 rounded-lg shadow-lg transition">
                🔒 CLOSE & BANK
            </button>
            <button onclick="handleTrade('SHORT')" class="bg-rose-600 hover:bg-rose-500 text-white font-bold py-3 rounded-lg shadow-lg transition">
                🐻 SHORT (SELL)
            </button>
        </div>
    </div>

    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const roomId = "room-1v1";
        let currentPrice = 0;
        let activePosition = null;
        let bankedScore = 0; // Authoritative score from server
        let playerSide = 'bull';

        let candles = [];
        let currentCandle = null;
        const CANDLE_INTERVAL = 60 * 1000;

        function processPriceTick(price, timestamp) {
            const candleTime = Math.floor(timestamp / CANDLE_INTERVAL) * CANDLE_INTERVAL;
            if (!currentCandle || currentCandle.time !== candleTime) {
                if (currentCandle) candles.push(currentCandle);
                if (candles.length > 35) candles.shift();
                currentCandle = { time: candleTime, open: price, high: price, low: price, close: price };
            } else {
                currentCandle.high = Math.max(currentCandle.high, price);
                currentCandle.low = Math.min(currentCandle.low, price);
                currentCandle.close = price;
            }
        }

        const ws = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@trade');
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            currentPrice = parseFloat(data.p);
            const timestamp = data.T;

            document.getElementById('livePrice').innerText = `$${currentPrice.toFixed(2)}`;
            processPriceTick(currentPrice, timestamp);
            socket.emit('priceUpdate', { roomId, price: currentPrice });

            updatePnLDisplay();
        };

        function updatePnLDisplay() {
            let floatPnL = 0;
            if (activePosition) {
                if (activePosition.type === 'LONG') {
                    floatPnL = (currentPrice - activePosition.entryPrice) * activePosition.leverage;
                } else {
                    floatPnL = (activePosition.entryPrice - currentPrice) * activePosition.leverage;
                }
            }

            const floatEl = document.getElementById('floatingPnL');
            floatEl.innerText = `${floatPnL >= 0 ? '+' : ''}$${floatPnL.toFixed(2)}`;
            floatEl.className = floatPnL >= 0 ? 'font-bold text-green-400' : 'font-bold text-red-400';

            document.getElementById('bankedScoreDisp').innerText = `${bankedScore >= 0 ? '+' : ''}$${bankedScore.toFixed(2)}`;

            const totalNet = bankedScore + floatPnL;
            const netEl = document.getElementById('totalNetPnL');
            netEl.innerText = `${totalNet >= 0 ? '+' : ''}$${totalNet.toFixed(2)}`;
            netEl.className = totalNet >= 0 ? 'text-lg font-bold text-green-400' : 'text-lg font-bold text-red-400';
        }

        function handleTrade(type) {
            const leverage = 1; // Default multiplier
            activePosition = { type, entryPrice: currentPrice, leverage };
            playerSide = type === 'LONG' ? 'bull' : 'bear';
            socket.emit('openPosition', { roomId, type, leverage });
        }

        function handleClose() {
            if (!activePosition) return;
            socket.emit('closePosition', { roomId });
            activePosition = null;
        }

        socket.on('connect', () => {
            const savedName = localStorage.getItem('traderHandle') || 'Trader';
            socket.emit('joinRoom', { roomId, playerName: savedName });
        });

        socket.on('updateState', (room) => {
            const myState = room.players[socket.id];
            if (myState) {
                bankedScore = myState.realizedPnL || 0;
                if (!myState.position) {
                    activePosition = null; // Clear local position if server confirmed close/switch
                }
                updatePnLDisplay();
            }
        });

        function drawArena() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const allCandles = [...candles, currentCandle].filter(Boolean);
            if (allCandles.length > 0) {
                const maxPrice = Math.max(...allCandles.map(c => c.high));
                const minPrice = Math.min(...allCandles.map(c => c.low));
                const priceRange = maxPrice - minPrice || 1;
                const chartHeight = canvas.height - 70;
                const candleWidth = canvas.width / Math.max(allCandles.length, 25);

                ctx.strokeStyle = '#1e293b';
                ctx.lineWidth = 1;
                for (let i = 1; i < 4; i++) {
                    let yGrid = (chartHeight / 4) * i;
                    ctx.beginPath();
                    ctx.moveTo(0, yGrid);
                    ctx.lineTo(canvas.width, yGrid);
                    ctx.stroke();
                }

                allCandles.forEach((c, i) => {
                    const x = i * candleWidth + 10;
                    const isGreen = c.close >= c.open;
                    
                    const yHigh = chartHeight - ((c.high - minPrice) / priceRange) * (chartHeight - 40) - 20;
                    const yLow = chartHeight - ((c.low - minPrice) / priceRange) * (chartHeight - 40) - 20;
                    const yOpen = chartHeight - ((c.open - minPrice) / priceRange) * (chartHeight - 40) - 20;
                    const yClose = chartHeight - ((c.close - minPrice) / priceRange) * (chartHeight - 40) - 20;

                    ctx.strokeStyle = isGreen ? '#22c55e' : '#ef4444';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(x + candleWidth / 2, yHigh);
                    ctx.lineTo(x + candleWidth / 2, yLow);
                    ctx.stroke();

                    ctx.fillStyle = isGreen ? 'rgba(34, 197, 94, 0.7)' : 'rgba(239, 68, 68, 0.7)';
                    const bodyY = Math.min(yOpen, yClose);
                    const bodyHeight = Math.max(Math.abs(yOpen - yClose), 3);
                    ctx.fillRect(x + 1, bodyY, candleWidth - 3, bodyHeight);
                });

                ctx.fillStyle = '#94a3b8';
                ctx.font = '10px monospace';
                ctx.textAlign = 'right';
                ctx.fillText(`$${maxPrice.toFixed(0)}`, canvas.width - 10, 15);
                ctx.fillText(`$${minPrice.toFixed(0)}`, canvas.width - 10, chartHeight - 5);
            }

            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, canvas.height - 35, canvas.width, 35);
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height - 35);
            ctx.lineTo(canvas.width, canvas.height - 35);
            ctx.stroke();

            ctx.font = '46px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(playerSide === 'bull' ? '🐂' : '🐻', 160, canvas.height - 45);
            ctx.fillText(playerSide === 'bull' ? '🐻' : '🐂', 440, canvas.height - 45);

            ctx.fillStyle = '#f59e0b';
            ctx.font = 'bold 14px monospace';
            ctx.fillText('VS', canvas.width / 2, canvas.height - 55);

            requestAnimationFrame(drawArena);
        }

        drawArena();
    </script>
</body>
</html>
