<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeRival 1v1 - Real-Time Crypto Trading Duel Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: monospace; }
        canvas { border: 2px solid #334155; border-radius: 8px; background: #020617; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <header class="text-center mb-4">
        <h1 class="text-3xl font-extrabold text-amber-400 tracking-wider">⚡ TRADERIVAL 1v1 ⚡</h1>
        <p class="text-xs text-slate-400">Live Crypto Combat • 1-Min Candlestick Arena</p>
    </header>

    <div class="relative w-full max-w-2xl">
        <!-- HUD Header -->
        <div class="flex justify-between items-center bg-slate-800 p-3 rounded-t-lg border-b border-slate-700">
            <div>
                <span class="text-xs text-slate-400">BTC/USDT:</span>
                <span id="livePrice" class="text-lg font-bold text-green-400">$0.00</span>
            </div>
            <div class="text-right">
                <span class="text-xs text-slate-400">TOTAL SCORE (BANKED):</span>
                <span id="playerScore" class="text-lg font-bold text-amber-400">$0.00</span>
                <div class="text-xs">
                    <span class="text-slate-400">Active Trade PnL:</span> 
                    <span id="floatingPnL" class="font-bold text-slate-200">$0.00</span>
                </div>
            </div>
        </div>

        <canvas id="gameCanvas" width="600" height="300" class="w-full"></canvas>

        <div class="grid grid-cols-3 gap-2 mt-3">
            <button onclick="handleTrade('LONG')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-lg shadow-lg">
                🐂 LONG (BUY)
            </button>
            <button onclick="handleClose()" class="bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 rounded-lg shadow-lg">
                🔒 CLOSE & BANK
            </button>
            <button onclick="handleTrade('SHORT')" class="bg-rose-600 hover:bg-rose-500 text-white font-bold py-3 rounded-lg shadow-lg">
                🐻 SHORT (SELL)
            </button>
        </div>
    </div>

    <script>
        const socket = io();
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const roomId = "room-1v1";
        let currentPrice = 0;
        let activePosition = null;
        let bankedScore = 0;
        let playerSide = 'bull';

        let candles = [];
        let currentCandle = null;
        const CANDLE_INTERVAL = 60 * 1000;

        function processPriceTick(price, timestamp) {
            const candleTime = Math.floor(timestamp / CANDLE_INTERVAL) * CANDLE_INTERVAL;
            if (!currentCandle || currentCandle.time !== candleTime) {
                if (currentCandle) candles.push(currentCandle);
                if (candles.length > 40) candles.shift();
                currentCandle = { time: candleTime, open: price, high: price, low: price, close: price };
            } else {
                currentCandle.high = Math.max(currentCandle.high, price);
                currentCandle.low = Math.min(currentCandle.low, price);
                currentCandle.close = price;
            }
        }

        const ws = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@trade');
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            currentPrice = parseFloat(data.p);
            const timestamp = data.T;

            document.getElementById('livePrice').innerText = `$${currentPrice.toFixed(2)}`;
            processPriceTick(currentPrice, timestamp);
            socket.emit('priceUpdate', { roomId, price: currentPrice });

            // Calculate active floating trade PnL in real-time
            if (activePosition) {
                let floatPnL = 0;
                if (activePosition.type === 'LONG') {
                    floatPnL = currentPrice - activePosition.entryPrice;
                } else {
                    floatPnL = activePosition.entryPrice - currentPrice;
                }
                const floatEl = document.getElementById('floatingPnL');
                floatEl.innerText = `${floatPnL >= 0 ? '+' : ''}$${floatPnL.toFixed(2)}`;
                floatEl.className = floatPnL >= 0 ? 'font-bold text-green-400' : 'font-bold text-red-400';
            } else {
                document.getElementById('floatingPnL').innerText = '$0.00';
                document.getElementById('floatingPnL').className = 'font-bold text-slate-200';
            }
        };

        function handleTrade(type) {
            activePosition = { type, entryPrice: currentPrice };
            playerSide = type === 'LONG' ? 'bull' : 'bear';
            socket.emit('openPosition', { roomId, type, price: currentPrice });
        }

        function handleClose() {
            if (!activePosition) return;
            socket.emit('closePosition', { roomId, currentPrice });
            activePosition = null;
        }

        socket.on('connect', () => {
            const savedName = localStorage.getItem('traderHandle') || 'Trader';
            socket.emit('joinRoom', { roomId, playerName: savedName });
        });

        socket.on('updateState', (room) => {
            const myState = room.players[socket.id];
            if (myState) {
                bankedScore = myState.score || 0;
                const scoreEl = document.getElementById('playerScore');
                scoreEl.innerText = `${bankedScore >= 0 ? '+' : ''}$${bankedScore.toFixed(2)}`;
                scoreEl.className = bankedScore >= 0 ? 'text-lg font-bold text-green-400' : 'text-lg font-bold text-red-400';
            }
        });

        function drawArena() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const allCandles = [...candles, currentCandle].filter(Boolean);
            if (allCandles.length > 0) {
                const maxPrice = Math.max(...allCandles.map(c => c.high));
                const minPrice = Math.min(...allCandles.map(c => c.low));
                const priceRange = maxPrice - minPrice || 1;
                const candleWidth = canvas.width / Math.max(allCandles.length, 25);

                allCandles.forEach((c, i) => {
                    const x = i * candleWidth + 10;
                    const isGreen = c.close >= c.open;
                    const yHigh = canvas.height - ((c.high - minPrice) / priceRange) * (canvas.height * 0.7) - 30;
                    const yLow = canvas.height - ((c.low - minPrice) / priceRange) * (canvas.height * 0.7) - 30;
                    const yOpen = canvas.height - ((c.open - minPrice) / priceRange) * (canvas.height * 0.7) - 30;
                    const yClose = canvas.height - ((c.close - minPrice) / priceRange) * (canvas.height * 0.7) - 30;

                    ctx.strokeStyle = isGreen ? 'rgba(34, 197, 94, 0.5)' : 'rgba(239, 68, 68, 0.5)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(x + candleWidth / 2, yHigh);
                    ctx.lineTo(x + candleWidth / 2, yLow);
                    ctx.stroke();

                    ctx.fillStyle = isGreen ? 'rgba(34, 197, 94, 0.4)' : 'rgba(239, 68, 68, 0.4)';
                    const bodyY = Math.min(yOpen, yClose);
                    const bodyHeight = Math.max(Math.abs(yOpen - yClose), 2);
                    ctx.fillRect(x + 2, bodyY, candleWidth - 4, bodyHeight);
                });
            }

            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, canvas.height - 25, canvas.width, 25);

            ctx.font = '42px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(playerSide === 'bull' ? '🐂' : '🐻', 150, canvas.height - 35);
            ctx.fillText(playerSide === 'bull' ? '🐻' : '🐂', 450, canvas.height - 35);

            requestAnimationFrame(drawArena);
        }

        drawArena();
    </script>
</body>
</html>
